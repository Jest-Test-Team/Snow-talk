[package]
name = "snow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]
# Tor mode via Arti. Adds roughly 10 MB to the app.
# Adult interest tags / profile flag. Android and sideload builds only; the
# iOS build leaves this off so the code is compiled out (App Store policy).
adult_tags = []
tor = ["dep:arti-client", "dep:tor-rtcompat"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
snow-psi = { path = "../snow-psi" }
snow-media = { path = "../snow-media" }
snow-safety = { path = "../snow-safety" }
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite"], optional = true }
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
postcard = { workspace = true, features = ["alloc"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
snow-crypto = { version = "0.1.0", path = "../snow-crypto" }
snow-pow = { version = "0.1.0", path = "../snow-pow" }
snow-proto = { version = "0.1.0", path = "../snow-proto" }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"], optional = true }
uniffi = "0.32"
url = "2.5.8"
webpki-roots = "1.0.12"
zeroize.workspace = true

[dev-dependencies]
rcgen = "0.14.7"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt"] }
