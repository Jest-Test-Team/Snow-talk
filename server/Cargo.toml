[package]
name = "snow-server"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9"
snow-proto = { path = "../crates/snow-proto" }
snow-tokens = { path = "../crates/snow-tokens" }
snow-pow = { path = "../crates/snow-pow" }
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
console_error_panic_hook = "0.1"
# App Store signed-transaction (JWS) verification.
x509-cert = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
base64 = "0.22"
serde_json = "1"

[features]
# E2E only: trust a test root from APPLE_TEST_ROOT. Never enable for deploys.
e2e-test-root = []

[dev-dependencies]
rcgen = "0.14"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }

[profile.release]
lto = true
opt-level = "s"
strip = false
