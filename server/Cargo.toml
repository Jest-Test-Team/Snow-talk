[package]
name = "snow-server"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9"
snow-proto = { path = "../crates/snow-proto" }
snow-tokens = { path = "../crates/snow-tokens" }
snow-pow = { path = "../crates/snow-pow" }
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = false
