name = "snow-talk"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
# Public relay URL: https://snow-talk.pcleegood.workers.dev (the apps' default).
# No per-version preview URLs: every deployed version would be publicly reachable.
workers_dev = true
preview_urls = false

[build]
# SNOW_BUILD_ARGS is only set by scripts/e2e.sh (test-only cargo features).
command = "worker-build --release $SNOW_BUILD_ARGS"

[vars]
POW_DIFFICULTY = "23"
# Paranoid mode (constant cover traffic) keeps rooms from hibernating, so it is a
# VIP perk. "open" = grant to anyone (dev/beta); anything else = token required.
# Beta (2026-11): every perk is free while we test and grow. Set back to
# "token" to charge VIP tokens again.
PARANOID_GRANT = "open"
# Good-chat tokens needed for the trusted queue, and how long a trusted waiter
# is reserved for other trusted users before anyone may be matched with them.
TRUSTED_MIN = "3"
TRUSTED_EXCLUSIVE_SECS = "30"
# 24 h room hold (saved sessions): "open" = anyone (dev); else one VIP token.
EXTEND_GRANT = "open"
# App Store products that buy VIP tokens: "product_id:tokens,..." (≤ 16 each).
APPLE_BUNDLE_ID = "app.snowtalk.ios"
APPLE_PRODUCTS = ""
APPLE_SANDBOX = "false"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "CHATROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "NULLIFIERS"
class_name = "Nullifiers"

# Public, non-secret objects: config.bin (signed offline, see snow-config) and
# catalog.json (pinned by hash inside config.bin).
[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "snow-talk-public"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "ChatRoom"]

[[durable_objects.bindings]]
name = "REDEMPTIONS"
class_name = "Redemptions"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Nullifiers"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Redemptions"]

# Logging policy: request metadata (which includes client IPs) is never collected.
# Code only logs lifecycle event names; see src/util.rs `event()`.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
