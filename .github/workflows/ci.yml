name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Clippy (config signing tool)
        run: cargo clippy -p snow-config --features tool --all-targets -- -D warnings
      - name: snow-proto / snow-pow build for wasm
        run: cargo build -p snow-proto -p snow-pow -p snow-tokens --target wasm32-unknown-unknown
      - name: tor feature
        run: cargo clippy -p snow-core -p snow-cli --features snow-cli/tor --all-targets -- -D warnings
      - name: adult_tags feature (Android build)
        run: cargo test -p snow-core --features adult_tags
      - name: vendored SQLite is patched
        run: ./scripts/check-vendor.sh
      - name: server check
        working-directory: server
        run: cargo check --target wasm32-unknown-unknown
      - name: server tests (tickets, App Store verification)
        working-directory: server
        run: cargo test
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: server/Cargo.toml
          command: check advisories bans sources
