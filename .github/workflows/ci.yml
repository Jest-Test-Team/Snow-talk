name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Clippy (config signing tool)
        run: cargo clippy -p snow-config --features tool --all-targets -- -D warnings
      - name: snow-proto / snow-pow build for wasm
        run: cargo build -p snow-proto -p snow-pow -p snow-tokens --target wasm32-unknown-unknown
      - name: adult_tags feature (Android build)
        run: cargo test -p snow-core --features adult_tags
      - name: server check
        working-directory: server
        run: cargo check --target wasm32-unknown-unknown
      - name: server tests (tickets, App Store verification)
        working-directory: server
        run: cargo test
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: server/Cargo.toml
          command: check advisories bans sources
