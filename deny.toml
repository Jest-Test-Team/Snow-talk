# Client crates are Apache-2.0; copyleft (notably libsignal's AGPL) is not allowed.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",          # async_executors (via arti, `tor` feature)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [{ name = "libsignal-protocol" }]

[advisories]
yanked = "deny"
# Each ignore must say why it doesn't apply, and be re-checked on every upgrade of the crate that pulls it in.
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml via uniffi bindgen (`bindgen` feature, build tool only)" },
]
