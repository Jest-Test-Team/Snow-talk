[workspace]
resolver = "2"
members = [
    "crates/snow-proto",
    "crates/snow-crypto",
    "crates/snow-pow",
    "crates/snow-core",
    "crates/snow-cli",
]
# server/ targets wasm32 and is built separately with worker-build.
exclude = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/snowtalk/snow-talk"
rust-version = "1.85"

[workspace.dependencies]
snow-proto = { path = "crates/snow-proto" }
snow-crypto = { path = "crates/snow-crypto" }
snow-pow = { path = "crates/snow-pow" }
snow-core = { path = "crates/snow-core" }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "2"
rand = "0.8"
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
