[workspace]
resolver = "2"
members = [
    "crates/snow-proto",
    "crates/snow-crypto",
    "crates/snow-pow",
    "crates/snow-psi",
    "crates/snow-media",
    "crates/snow-safety",
    "crates/snow-tokens",
    "crates/snow-config",
    "crates/snow-core",
    "crates/snow-cli",
]
# server/ targets wasm32 and is built separately with worker-build.
exclude = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/snowtalk/snow-talk"
rust-version = "1.85"

[workspace.dependencies]
snow-proto = { path = "crates/snow-proto" }
snow-core = { path = "crates/snow-core" }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "2"
rand = "0.8"
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

# Only for scripts/gen-bindings.sh: UniFFI reads its metadata from the library's
# symbols, which `strip = true` removes (on Linux). Not shipped.
[profile.bindings]
inherits = "release"
strip = false
lto = false
codegen-units = 16

# arti 0.48 pins rusqlite 0.40 → libsqlite3-sys 0.38, whose bundled SQLite 3.53.2
# has CVE-2026-119375 (RUSTSEC-2026-0459). This is libsqlite3-sys 0.38.2 with the
# SQLite 3.54.1 amalgamation from libsqlite3-sys 0.39.1. See vendor/README.md.
# Drop it once arti depends on rusqlite >= 0.41.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
